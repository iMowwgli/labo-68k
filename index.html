<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Labo-68K</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Simulateur 68000, moulinette et entraînement type contrôle S3 (EPITA).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Concept : l'établi d'un labo d'électronique la nuit — fond bleu nuit quadrillé façon oscilloscope,
   panneaux de registres comme sur la datasheet Motorola, un seul accent électrique.
   Thème sombre assumé (single-theme), toutes les couleurs explicites. */
:root{
  color-scheme: dark;
  --bg:#05080F; --bg2:#08101D; --panel:#0C1526; --panel2:#111D34; --inset:#070D19;
  --line:#1A2843; --line2:#26385E;
  --fg:#E3EBF9; --muted:#8C9DBE; --dim:#5B6C8F;
  --acc:#4D8DFF; --acc-ink:#04122B; --acc-soft:rgba(77,141,255,.14); --acc-glow:rgba(77,141,255,.45);
  --ok:#3BD69C; --ok-soft:rgba(59,214,156,.13); --ko:#FF6B82; --ko-soft:rgba(255,107,130,.13); --warn:#FFC24D; --warn-soft:rgba(255,194,77,.13);
  --t-mn:#7FB2FF; --t-reg:#F5B86B; --t-num:#7DE3C8; --t-com:#56688C; --t-lab:#E0A3FF; --t-str:#B7E57A;
  --f-disp:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px; --r-sm:6px;
}
:root[data-acc="cyan"]{--acc:#2DD4E8;--acc-ink:#021A1F;--acc-soft:rgba(45,212,232,.13);--acc-glow:rgba(45,212,232,.45)}
:root[data-acc="indigo"]{--acc:#8E86FF;--acc-ink:#0D0A2B;--acc-soft:rgba(142,134,255,.15);--acc-glow:rgba(142,134,255,.45)}
:root[data-acc="ambre"]{--acc:#FFB547;--acc-ink:#2A1A02;--acc-soft:rgba(255,181,71,.13);--acc-glow:rgba(255,181,71,.4)}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;min-height:100%;
  background:
    radial-gradient(1200px 600px at 85% -10%, var(--acc-soft), transparent 60%),
    linear-gradient(var(--bg),var(--bg));
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(120,150,210,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,210,.05) 1px,transparent 1px);
  background-size:28px 28px;mask-image:linear-gradient(to bottom,#000 0%,transparent 70%)}
a{color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
code,.mono{font-family:var(--f-mono);font-variant-ligatures:none}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- barre du haut ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(5,8,15,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-family:var(--f-disp);font-weight:700;font-size:19px;letter-spacing:.04em}
.chip68{width:30px;height:30px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;position:relative;font-family:var(--f-mono);font-size:9px;color:var(--acc)}
.chip68::before,.chip68::after{content:"";position:absolute;left:-5px;right:-5px;top:7px;bottom:7px;border-left:3px dotted var(--dim);border-right:3px dotted var(--dim)}
.logo b{color:var(--acc)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;padding:7px 11px;border-radius:7px;transition:color .15s,background .15s}
nav.tabs a:hover{color:var(--fg);background:var(--panel)}
nav.tabs a.on{color:var(--fg);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--acc)}
.hud{display:flex;align-items:center;gap:12px}
.lvl{display:flex;align-items:center;gap:9px;min-width:0}
.lvl .badge{font-family:var(--f-disp);font-weight:700;font-size:13px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc)}
.lvl .meta{display:flex;flex-direction:column;gap:3px;min-width:110px}
.lvl .name{font-size:12px;color:var(--muted);line-height:1;white-space:nowrap}
.xpbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--acc);box-shadow:0 0 10px var(--acc-glow);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.combo{font-family:var(--f-mono);font-size:13px;padding:4px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.combo.hot{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.iconbtn{background:none;border:1px solid var(--line2);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--dim)}
.swatches{display:flex;gap:6px}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--fg)}

/* ---------- général ---------- */
main{padding-block:28px 80px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(30px,5vw,52px)}
h2{font-size:clamp(23px,3vw,31px)}
h3{font-size:18px;font-weight:600}
p{margin:0}
.lead{color:var(--muted);max-width:62ch;font-size:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.grid2>*,.grid3>*,.grid4>*{min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid2.eq{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2.lft{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:900px){.grid2,.grid2.eq,.grid2.lft,.grid3{grid-template-columns:minmax(0,1fr)}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid4{grid-template-columns:minmax(0,1fr)}.lvl .meta{display:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:transparent}
.card h3{margin-bottom:10px}
.sub{color:var(--muted);font-size:13.5px}
.tiny{font-size:12px;color:var(--dim)}
.sep{height:1px;background:var(--line);border:0;margin:6px 0}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);text-decoration:none;transition:transform .08s,background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:0 0 0 0 var(--acc-glow)}
.btn.pri:hover{box-shadow:0 0 18px -2px var(--acc-glow)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;border-bottom-width:2px;border-radius:4px;padding:0 4px;opacity:.7}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:var(--f-mono);padding:3px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:rgba(59,214,156,.4);background:var(--ok-soft)}
.pill.ko{color:var(--ko);border-color:rgba(255,107,130,.4);background:var(--ko-soft)}
.pill.acc{color:var(--acc);border-color:var(--acc);background:var(--acc-soft)}
input.field,select.field{background:var(--inset);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;font-family:var(--f-mono);font-size:14px;width:100%;min-width:0;transition:border-color .15s,background .2s}
input.field:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
.field.ok{border-color:var(--ok);background:var(--ok-soft)}
.field.ko{border-color:var(--ko);background:var(--ko-soft)}
label.lab{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.check{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer}

/* ---------- registres & mémoire (style datasheet) ---------- */
.regs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 14px;font-family:var(--f-mono);font-size:13.5px}
.reg{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:6px;background:var(--inset);border:1px solid var(--line);white-space:nowrap}
.reg b{color:var(--t-reg);font-weight:500}
.reg.flash{animation:flash 1s ease-out}
@keyframes flash{0%{background:var(--acc-soft);border-color:var(--acc)}100%{background:var(--inset);border-color:var(--line)}}
.memtbl{font-family:var(--f-mono);font-size:14px;display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.memrow{display:flex;gap:12px;white-space:nowrap}
.memrow .ad{color:var(--dim)}
.memrow .bytes span{display:inline-block;width:2.3ch;text-align:center;margin-right:.5ch;border-radius:3px}
.memrow .bytes span.ch{background:var(--acc-soft);color:var(--acc);outline:1px solid var(--acc)}
.memrow .bytes span.ok{background:var(--ok-soft);color:var(--ok)}
.memrow .bytes span.ko{background:var(--ko-soft);color:var(--ko);text-decoration:line-through}
.instr{font-family:var(--f-mono);font-size:clamp(17px,2.6vw,24px);font-weight:500;padding:14px 16px;background:var(--inset);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:8px;overflow-x:auto;white-space:nowrap}
.ansgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.ansgrid,.regs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.memin{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-family:var(--f-mono)}
.memin .ad{color:var(--dim);font-size:13px}
.memin input{letter-spacing:.06em}

/* ---------- feedback ---------- */
.fb{border-radius:9px;padding:14px 16px;border:1px solid var(--line2);background:var(--panel2);display:flex;flex-direction:column;gap:10px}
.fb.ok{border-color:rgba(59,214,156,.5);background:linear-gradient(180deg,var(--ok-soft),transparent)}
.fb.ko{border-color:rgba(255,107,130,.5);background:linear-gradient(180deg,var(--ko-soft),transparent)}
.fb .verdict{font-family:var(--f-disp);font-weight:700;font-size:20px;display:flex;gap:10px;align-items:center}
.fb.ok .verdict{color:var(--ok)} .fb.ko .verdict{color:var(--ko)}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--f-mono);font-size:13.5px}
.chain span{padding:2px 7px;border-radius:5px;background:var(--inset);border:1px solid var(--line)}
.chain span:last-child{border-color:var(--acc);color:var(--acc)}
.chain i{color:var(--dim);font-style:normal}
.note{font-size:13px;color:var(--warn);padding-left:10px;border-left:2px solid var(--warn)}
.explain{display:flex;flex-direction:column;gap:7px;font-size:14px}
.explain code{background:var(--inset);padding:1px 5px;border-radius:4px;font-size:13px}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{position:fixed;z-index:60;pointer-events:none;font-family:var(--f-disp);font-weight:700;font-size:22px;color:var(--acc);text-shadow:0 0 18px var(--acc-glow);animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:8px;padding:10px 14px;max-width:min(360px,calc(100vw - 32px));box-shadow:0 12px 30px rgba(0,0,0,.45);animation:tin .3s ease-out;font-size:14px}
.toast b{font-family:var(--f-disp)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:65}

/* ---------- flags ---------- */
.flags{display:flex;gap:8px;flex-wrap:wrap}
.flag{width:56px;height:62px;border-radius:9px;border:1px solid var(--line2);background:var(--inset);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:2px;transition:all .12s;user-select:none}
.flag .k{font-family:var(--f-disp);font-weight:700;font-size:13px;color:var(--muted)}
.flag .v{font-family:var(--f-mono);font-size:22px;font-weight:700;color:var(--dim)}
.flag.on{border-color:var(--acc);background:var(--acc-soft)}
.flag.on .v{color:var(--acc);text-shadow:0 0 12px var(--acc-glow)}
.flag.ok{outline:2px solid var(--ok)} .flag.ko{outline:2px solid var(--ko)}
.leds{display:flex;gap:6px;font-family:var(--f-mono);font-size:12px}
.led{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.led i{width:12px;height:12px;border-radius:50%;background:var(--line2);transition:background .2s,box-shadow .2s}
.led.on i{background:var(--acc);box-shadow:0 0 10px var(--acc-glow)}
.bigop{font-family:var(--f-mono);font-size:clamp(26px,5vw,42px);font-weight:700;letter-spacing:.02em;overflow-x:auto;white-space:nowrap}
.bin{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);overflow-x:auto;white-space:pre;line-height:1.5}
.bin b{color:var(--acc);font-weight:500}

/* ---------- éditeur ---------- */
.ed{display:flex;border:1px solid var(--line2);border-radius:9px;background:var(--inset);overflow:hidden;height:var(--edh,440px);font-family:var(--f-mono);font-size:13.5px;line-height:21px;tab-size:8;-moz-tab-size:8}
.gut{flex:none;width:48px;overflow:hidden;background:var(--bg2);border-right:1px solid var(--line);padding-block:10px;color:var(--dim);text-align:right;user-select:none}
.gut div{height:21px;padding-right:9px;cursor:pointer;position:relative}
.gut div:hover{color:var(--muted)}
.gut div.bp::before{content:"";position:absolute;left:7px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--ko);box-shadow:0 0 8px var(--ko)}
.edw{position:relative;flex:1;min-width:0}
.edw pre,.edw textarea{position:absolute;inset:0;margin:0;padding:10px 12px;font:inherit;line-height:inherit;white-space:pre;tab-size:8;-moz-tab-size:8;border:0;letter-spacing:0;font-variant-ligatures:none}
.edw pre{overflow:hidden;pointer-events:none;color:var(--fg)}
.edw textarea{background:transparent;color:transparent;caret-color:var(--acc);resize:none;overflow:auto;outline:none}
.edw textarea::selection{background:rgba(77,141,255,.3);color:transparent}
.ln{display:inline-block;min-width:100%}
.ln.cur{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.ln.err{background:var(--ko-soft);box-shadow:inset 3px 0 0 var(--ko)}
.t-mn{color:var(--t-mn);font-weight:500}.t-reg{color:var(--t-reg)}.t-num{color:var(--t-num)}.t-com{color:var(--t-com);font-style:italic}.t-lab{color:var(--t-lab)}.t-str{color:var(--t-str)}
.listing{font-family:var(--f-mono);font-size:13.5px;line-height:1.6;background:var(--inset);border:1px solid var(--line2);border-radius:9px;padding:12px 14px;overflow-x:auto;white-space:pre;tab-size:8}

/* ---------- labo ---------- */
.labo{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.labo{grid-template-columns:minmax(0,1fr)}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.errbar{font-family:var(--f-mono);font-size:13px;color:var(--ko);background:var(--ko-soft);border:1px solid rgba(255,107,130,.4);border-radius:7px;padding:8px 11px}
.status{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.console{font-family:var(--f-mono);font-size:13px;background:#02050B;border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:56px;max-height:160px;overflow:auto;white-space:pre-wrap;color:var(--t-num)}
.memview{font-family:var(--f-mono);font-size:12.5px;line-height:1.7;overflow-x:auto;white-space:pre}
.memview .ch{background:var(--acc);color:var(--acc-ink);border-radius:2px}
.memview .sp{color:var(--warn)}
.memview .a{color:var(--dim)}

/* ---------- moulinette ---------- */
.moul{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.moul{grid-template-columns:minmax(0,1fr)}}
.chlist{display:flex;flex-direction:column;gap:6px}
@media (max-width:900px){.chlist{flex-direction:row;overflow-x:auto;padding-bottom:4px}.chlist .chi{flex:none;width:190px}}
.chi{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;width:100%}
.chi:hover{border-color:var(--line2)}
.chi.on{border-color:var(--acc);background:var(--acc-soft)}
.chi .nm{font-weight:600;font-size:14px}
.dots{display:flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--line2)}.dots i.f{background:var(--acc)}
.done{color:var(--ok);font-family:var(--f-mono);font-size:12px}
.term{font-family:var(--f-mono);font-size:13px;background:#02050B;border:1px solid var(--line);border-radius:9px;padding:12px 14px;max-height:360px;overflow:auto;line-height:1.65}
.term .l{white-space:pre-wrap;animation:tin .2s ease-out both}
.term .okk{color:var(--ok)} .term .kok{color:var(--ko)} .term .dm{color:var(--dim)} .term .hd{color:var(--acc)}

/* ---------- accueil ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:10px 26px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1 em{font-style:normal;color:var(--acc);text-shadow:0 0 28px var(--acc-glow)}
.cpu{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.cpu::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
.cpu .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cpu .cur{font-family:var(--f-mono);font-size:14px;padding:8px 10px;border-radius:7px;background:var(--inset);border:1px solid var(--line);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:inline-flex;align-items:center;gap:6px}.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 1.4s infinite}

  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[\s.'’"]/g, '').replace(/^LE|^LA/, '');
  function genEx3() { const g = pick(QGEN)(); return g; }
  function check3(q, input) {
    const t = (input || '').trim();
    if (!t) return false;
    if (q.type === 'num') {
      let v; try { v = M.evalExpr(t.replace(/\s/g, ''), {}, 0); } catch (e) { return false; }
      return q.ans.includes(v);
    }
    if (q.type === 'ins') {
      const c = M.canon(t.replace(/\bSP\b/gi, 'A7'));
      return !!c && q.ans.some(a => M.canon(a) === c);
    }
    const n = norm(t);
    return q.ans.some(a => norm(a) === n);
  }

  /* ================= EXERCICE 4 : traçage de programme ================= */
  const CCS1 = ['GT', 'GE', 'LT', 'LE', 'HI', 'HS', 'LO', 'LS', 'EQ', 'NE', 'PL', 'MI'];
  const SIGNED = ['GT', 'GE', 'LT', 'LE'];
  const ROT_OPS = [
    () => `ror.w #${pick([4, 8])},d4`, () => `ror.l #${pick([4, 8])},d4`, () => `rol.l #${pick([4, 8])},d4`, () => `rol.w #${pick([4, 8])},d4`,
    () => 'swap d4', () => `rol.b #4,d4`, () => `ror.b #4,d4`, () => `lsl.w #${pick([4, 8])},d4`, () => `lsr.l #${pick([4, 8])},d4`,
    () => 'not.b d4', () => 'ext.w d4', () => `asr.w #4,d4`, () => 'swap d4', () => `lsl.l #4,d4`,
  ];
  function genEx4() {
    const d7 = rnd32();
    const s1 = pick(['W', 'W', 'B', 'L']);
    const cc = pick(CCS1);
    const immv = s1 === 'B' ? pick([0x70, 0x80, 0x10, 0x7F, 0xF0, 0x40]) : s1 === 'W' ? pick([0x7000, 0x8000, 0x1000, 0xC000, 0x0400, 0x7FFF]) : pick([0x40000000, 0x80000000, 0x10000000, 0x7FFFFFFF]);
    const p1 = rnd(1, 4), p2 = p1 + rnd(1, 4);
    // partie 2
    const s2 = Math.random() < 0.75 ? 'b' : 'w';
    let n2;
    if (s2 === 'b') n2 = Math.random() < 0.15 ? pick([256, 512, 768]) : rnd(257, 900);
    else n2 = Math.random() < 0.5 ? rnd(65537, 66000) : rnd(3, 400);
    const n2txt = Math.random() < 0.5 ? String(n2) : '$' + hx(n2, 0);
    // partie 3
    const lw = Math.random() < 0.15 ? 0xFFFF : Math.random() < 0.3 ? 0 : rnd(0x10, 0xFFFE);
    const v3 = ((rnd(0, 0xFFFF) * 0x10000) + lw) >>> 0;
    const v3txt = Math.random() < 0.25 && lw < 30000 ? String(lw) : '$' + hx(v3, 8);
    const v3real = /^\$/.test(v3txt) ? v3 : lw;
    // partie 4
    const hexd = '0123456789ABCDEF'.split('').sort(() => Math.random() - 0.5).slice(0, 8).join('');
    const nops = rnd(4, 6); const ops4 = []; for (let k = 0; k < nops; k++) ops4.push(pick(ROT_OPS)());
    const prog = [
      `Main     move.l  #$${hx(d7, 8)},d7`,
      `part1    moveq.l #${p1},d1`,
      `         cmp.${s1.toLowerCase()}   #$${hx(immv, SN[s1] * 2)},d7`,
      `         b${cc.toLowerCase()}     part2`,
      `         moveq.l #${p2},d1`,
      `part2    clr.l   d2`,
      `         move.l  #${n2txt},d0`,
      `loop2    addq.l  #1,d2`,
      `         subq.${s2}  #1,d0`,
      `         bne     loop2`,
      `part3    clr.l   d3`,
      `         move.l  #${v3txt},d0`,
      `loop3    addq.l  #1,d3`,
      `         dbra    d0,loop3      ; DBRA = DBF`,
      `part4    move.l  #$${hexd},d4`,
      ...ops4.map(x => `         ${x}`),
    ].join('\n');
    const cpu = M.runSource(prog);
    const ans = [cpu.D[1], cpu.D[2], cpu.D[3], cpu.D[4]];
    // explication
    const sz = SN[s1], dv = M.tr(d7, sz), iv = M.tr(immv, sz);
    const tmp = new M.CPU(); tmp.subf(dv, iv, sz, 0, true); const taken = tmp.cond(cc);
    const signed = SIGNED.includes(cc);
    const ex = [];
    ex.push({ t: 'D1', lines: [
      `CMP.${s1} #$${hx(iv, sz * 2)},D7 compare <b>D7.${s1} = $${hx(dv, sz * 2)}</b> à $${hx(iv, sz * 2)} (D7.${s1} − $${hx(iv, sz * 2)}).`,
      signed ? `B${cc} est <b>signé</b> : ${M.sx(dv, sz)} vs ${M.sx(iv, sz)}.` : (['HI', 'HS', 'LO', 'LS'].includes(cc) ? `B${cc} est <b>non signé</b> : ${dv} vs ${iv}.` : `B${cc} teste un flag : N=${tmp.N} Z=${tmp.Z} V=${tmp.V} C=${tmp.C}.`),
      `Condition ${taken ? 'VRAIE → saut à part2, D1 garde ' + p1 : 'FAUSSE → pas de saut, MOVEQ #' + p2 + ' s\'exécute'} → <b>D1 = $${hx(ans[0], 8)}</b>`,
    ] });
    const m2 = s2 === 'b' ? 0xFF : 0xFFFF, c2 = (n2 & m2) || (m2 + 1);
    ex.push({ t: 'D2', lines: [
      `${n2txt} = $${hx(n2, 0)} → SUBQ.${s2.toUpperCase()} ne regarde que D0.${s2.toUpperCase()} = $${hx(n2 & m2, s2 === 'b' ? 2 : 4)}.`,
      (n2 & m2) === 0 ? `D0.${s2.toUpperCase()} = 0 : le premier SUBQ donne $${s2 === 'b' ? 'FF' : 'FFFF'} (≠ 0) → on fait le tour complet : ${m2 + 1} tours.` : `La boucle tourne ${c2} fois (on sort quand D0.${s2.toUpperCase()} atteint 0).`,
      `<b>D2 = $${hx(ans[1], 8)}</b> (${c2} en décimal)`,
    ] });
    const lw3 = v3real & 0xFFFF;
    ex.push({ t: 'D3', lines: [
      `DBRA ne regarde que D0.W = $${hx(lw3, 4)} = ${lw3}.`,
      `Le corps s'exécute D0.W + 1 = ${lw3 + 1} fois${lw3 === 0xFFFF ? ' ($FFFF = 65535 : 65536 tours, piège classique)' : ''}.`,
      `<b>D3 = $${hx(ans[2], 8)}</b>`,
    ] });
    // trace partie 4
    const p4 = M.assemble(` move.l #$${hexd},d4\n` + ops4.map(x => ' ' + x).join('\n'));
    const c4 = new M.CPU(); c4.load(p4); const tl = [];
    while (!c4.halted) { const before = c4.pc; if (!c4.step()) break; const ins = p4.byAddr.get(before); tl.push(`${ins.op.padEnd(5)}${ins.size ? '.' + ins.size : ''} ${ins.ops.join(',')} → D4 = $${hx(c4.D[4], 8)}`); }
    ex.push({ t: 'D4', lines: tl.map(x => `<code>${x.toUpperCase()}</code>`).concat(['Rappel : une rotation .B/.W ne touche que l\'octet / le mot de poids faible. 1 chiffre hexa = 4 bits.']) });
    return { prog, ans, ex };
  }

  function runChallenge(ch, src) {
    const report = []; let passed = 0;
    let prog;
    try { prog = M.assemble(src, { entry: ch.entry }); }
    catch (e) { return { fatal: `Erreur d'assemblage ligne ${e.line ?? '?'} : ${e.message}`, line: e.line, report, passed: 0, total: 0 }; }
    if (prog.sym[ch.entry.toUpperCase()] === undefined) return { fatal: `L'étiquette « ${ch.entry} » est introuvable : la moulinette appelle JSR ${ch.entry}.`, report, passed: 0, total: 0 };
    const tests = ch.tests();
    for (const t of tests) {
      const cpu = new M.CPU(); cpu.load(prog);

    let timers = [];
    function runIt() {
      timers.forEach(clearTimeout); timers = [];
      const r = G.runChallenge(ch, ed.value);
      const term = $('#mcterm'); term.innerHTML = '';
      const line = (cls, txt, d) => timers.push(setTimeout(() => { const l = document.createElement('div'); l.className = 'l ' + cls; l.textContent = txt; term.appendChild(l); term.scrollTop = term.scrollHeight; }, d));
      line('dm', `$ moulinette --defi ${ch.id}`, 0);
      if (r.fatal) { line('kok', '[FATAL] ' + r.fatal, 120); ed.mark({ err: r.line }); sfx('ko'); return; }
      line('hd', `${r.total} tests · registres non utilisés remplis au hasard`, 120);
      r.report.forEach((t, i) => line(t.ok ? 'okk' : 'kok', `${t.ok ? '[ OK ]' : '[ KO ]'} ${t.name}${t.ok ? `  (${t.steps} instr.)` : '\n        ' + t.msg}`, 260 + i * 170));
      const pct = Math.round(r.passed / r.total * 100);
      timers.push(setTimeout(() => {
        line(pct === 100 ? 'okk' : 'kok', `\nRésultat : ${r.passed}/${r.total} · ${pct} %`, 0);
        if (pct === 100) {
          const first = !S.solved[ch.id]; S.solved[ch.id] = true; touchDay();
          if (first) { S.xp += 40 * ch.lvl; popAt($('#mcgo'), `+${40 * ch.lvl} XP`); confetti(120); sfx('lvl'); }
          else sfx('ok');
          save(); hud(); checkBadges();
          const b = $(`.chi[data-id="${ch.id}"]`); if (b && !$('.done', b)) b.insertAdjacentHTML('beforeend', '<span class="done">✓ 100 %</span>');
        } else { sfx('ko'); shake($('#mcterm')); }
      }, 300 + r.report.length * 170));
    }
    $('#mcgo').onclick = runIt;
    cleanup = () => timers.forEach(clearTimeout);
  }

  /* ================= EXAMEN BLANC ================= */
  let EX = null;
  function pageExam() {
    if (!EX) return examIntro();
    if (EX.graded) return examResult();
    examRun();
  }
  function examIntro() {
    app.innerHTML = `
    <div class="stack" style="gap:18px;max-width:880px">
      <div class="stack" style="gap:8px"><span class="eyebrow">Examen blanc · conditions réelles</span><h2>1 heure, 4 exercices, noté sur 20</h2><p class="lead">Un sujet complet généré au format du contrôle S3. Pas de correction pendant l'épreuve. À la fin, ta note, le détail par exercice et la correction pas à pas.</p></div>
      <div class="card"><div class="tblwrap"><table class="t"><thead><tr><th>Exercice</th><th>Contenu</th><th>Barème</th></tr></thead><tbody>
        <tr><td>1</td><td>4 instructions MOVE : mémoire + registres</td><td>6 pts (1,5 par ligne)</td></tr>
        <tr><td>2</td><td>4 additions : résultat + N Z V C</td><td>4 pts (0,5 résultat + 0,5 flags)</td></tr>
        <tr><td>3</td><td>4 questions de cours</td><td>4 pts</td></tr>
        <tr><td>4</td><td>Programme à tracer : D1, D2, D3, D4</td><td>6 pts (1,5 par registre)</td></tr></tbody></table></div>
        <p class="tiny" style="margin-top:10px">Barème estimé à partir du sujet (points par exercice). Ne détaille pas tes calculs, comme au vrai contrôle.</p></div>
      <div class="row"><button class="btn pri" id="exgo" type="button">Commencer l'examen</button><label class="check"><input type="checkbox" id="exshort"> Version courte (20 min)</label></div>
      ${S.exams.length ? `<div class="card"><span class="eyebrow">Historique</span><div class="tblwrap"><table class="t" style="margin-top:8px"><thead><tr><th>Date</th><th>Note</th><th>Ex.1</th><th>Ex.2</th><th>Ex.3</th><th>Ex.4</th></tr></thead><tbody>${S.exams.slice(-8).reverse().map(e => `<tr><td>${esc(e.date)}</td><td class="mono"><b>${String(e.score).replace('.', ',')}</b></td>${e.parts.map(p => `<td class="mono">${String(p).replace('.', ',')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>` : ''}
    </div>`;
    $('#exgo').onclick = () => { EX = G.genExam(); EX.end = Date.now() + ($('#exshort').checked ? 20 : 60) * 60000; EX.ans = {}; examRun(); };
  }
  function examRun() {
    const { st, e1, e2, e3, e4 } = EX;
    app.innerHTML = `
    <div class="timer"><span class="clock" id="exclock">60:00</span><span class="sub">Les réponses sont gardées si tu changes de page.</span><button class="btn pri" id="exsub" type="button">Rendre la copie</button></div>
    <div class="stack" style="gap:28px">
      <section class="exsec"><div class="hdr"><h3>Exercice 1 <span class="tiny">(6 points)</span></h3><span class="sub">Nouveau contenu de la mémoire et des registres modifiés. Mémoire et registres réinitialisés à chaque instruction.</span></div>
        ${initPanel(st)}
        ${e1.map((g, i) => `<div class="erow"><div class="instr" style="font-size:16px">${hl('\t' + g.ins).replace(/^\t/, '')}</div>
          <div class="memin">${[0, 8, 16].map((o, j) => `<span class="ad">$${hx(st.base + o, 6)}</span><input class="field" data-x="m${i}_${j}" value="${st.mem.slice(o, o + 8).map(b => hx(b, 2)).join(' ')}" autocomplete="off" spellcheck="false" aria-label="Instruction ${i + 1}, ligne $${hx(st.base + o, 6)}">`).join('')}</div>
          <div><label class="lab">Registres modifiés</label><input class="field" data-x="r${i}" placeholder="A1 = $00005004 ou « aucun »" autocomplete="off" spellcheck="false"></div></div>`).join('')}
      </section>
      <section class="exsec"><div class="hdr"><h3>Exercice 2 <span class="tiny">(4 points)</span></h3><span class="sub">Résultat des additions et flags N Z V C.</span></div>
        ${e2.map((q, i) => `<div class="erow e2r"><div class="mono" style="font-size:18px">${q.text} <span class="tiny">(${q.s * 8} bits)</span></div><input class="field" data-x="a${i}" placeholder="$..." autocomplete="off" spellcheck="false"><div class="mini-fl">${['N', 'Z', 'V', 'C'].map(f => `<button type="button" data-fl="${i}${f}" aria-label="Flag ${f}">${f}</button>`).join('')}</div></div>`).join('')}
        <p class="tiny">Un flag allumé (bleu) = 1, éteint = 0.</p>
      </section>
      <section class="exsec"><div class="hdr"><h3>Exercice 3 <span class="tiny">(4 points)</span></h3></div>
        ${e3.map((q, i) => `<div class="erow e3r"><span>${esc(q.q)}</span><input class="field" data-x="q${i}" autocomplete="off" spellcheck="false"></div>`).join('')}
      </section>
      <section class="exsec"><div class="hdr"><h3>Exercice 4 <span class="tiny">(6 points)</span></h3><span class="sub">Valeurs des registres après exécution, hexadécimal 32 bits.</span></div>
        <div class="grid2">${listing(e4.prog)}<div class="card ansgrid" style="grid-template-columns:repeat(2,minmax(0,1fr));align-content:start">${[1, 2, 3, 4].map(i => `<div><label class="lab">D${i} = $</label><input class="field" data-x="d${i}" autocomplete="off" spellcheck="false"></div>`).join('')}</div></div>
      </section>
      <div class="row"><button class="btn pri" id="exsub2" type="button">Rendre la copie</button><button class="btn ghost" id="exquit" type="button">Abandonner</button></div>
    </div>`;
    // restaurer / mémoriser
    $$('[data-x]').forEach(inp => { if (EX.ans[inp.dataset.x] !== undefined) inp.value = EX.ans[inp.dataset.x]; inp.addEventListener('input', () => EX.ans[inp.dataset.x] = inp.value); });
    $$('[data-fl]').forEach(b => { if (EX.ans['f' + b.dataset.fl]) b.classList.add('on'); b.onclick = () => { const k = 'f' + b.dataset.fl; EX.ans[k] = !EX.ans[k]; b.classList.toggle('on', EX.ans[k]); }; });
    const submit = () => { gradeExam(); examResult(); };
    $('#exsub').onclick = submit; $('#exsub2').onclick = submit;
    let armed = false;
    $('#exquit').onclick = e => { if (!armed) { armed = true; e.target.textContent = 'Confirmer l\'abandon'; return; } EX = null; examIntro(); };
    const tickc = () => { const ms = EX.end - Date.now(); if (ms <= 0) { toast('<b>Temps écoulé.</b> Copie ramassée.'); submit(); return; } const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60; const c = $('#exclock'); if (!c) return; c.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; c.classList.toggle('warn', ms < 5 * 60000); };
    tickc(); const iv = setInterval(tickc, 1000); cleanup = () => clearInterval(iv);
  }
  function parseRegs(t) {
    t = (t || '').trim(); const out = {};
    if (!t || /^aucun/i.test(t) || /^rien/i.test(t) || t === '-') return out;
    const re = /\b([DA][0-7])\s*[=:]\s*\$?([0-9A-Fa-f]{1,8})\b/g; let m; while ((m = re.exec(t))) out[m[1].toUpperCase()] = parseInt(m[2], 16) >>> 0;
    return out;
  }
  function gradeExam() {
    const { st, e1, e2, e3, e4, ans } = EX; const det = { e1: [], e2: [], e3: [], e4: [] };
    let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
    e1.forEach((g, i) => {
      const r = g.res;
      const memOk = [0, 1, 2].every(j => { const v = ans[`m${i}_${j}`]; const b = parseBytes(v !== undefined ? v : st.mem.slice(j * 8, j * 8 + 8).map(x => hx(x, 2)).join(' ')); return b && b.every((x, k) => x === r.mem[j * 8 + k]); });
      const given = parseRegs(ans['r' + i]); const exp = {}; r.regChanged.forEach(n => exp[n] = n[0] === 'D' ? r.D[+n[1]] : r.A[+n[1]]);
      const claimed = Object.keys(given).filter(k => given[k] !== (k[0] === 'D' ? st.D[+k[1]] : st.A[+k[1]]));
      const regOk = Object.entries(exp).every(([k, v]) => given[k] === v) && claimed.every(k => exp[k] !== undefined);
      const hasMem = r.memChanged.some(Boolean), hasReg = r.regChanged.length > 0;
      const pts = memOk && regOk ? 1.5 : ((memOk && hasMem) || (regOk && hasReg)) && hasMem && hasReg ? 0.75 : 0; p1 += pts; det.e1.push({ memOk, regOk, pts });
    });
    e2.forEach((q, i) => { const v = parseHex(ans['a' + i] || ''); const rok = v === q.r; const fok = ['N', 'Z', 'V', 'C'].every(f => (ans['f' + i + f] ? 1 : 0) === q[f]); const pts = (rok ? .5 : 0) + (fok ? .5 : 0); p2 += pts; det.e2.push({ rok, fok, pts }); });
    e3.forEach((q, i) => { const ok = G.check3(q, ans['q' + i] || ''); if (ok) p3++; det.e3.push({ ok }); });
    [1, 2, 3, 4].forEach((n, k) => { const ok = parseHex(ans['d' + n] || '') === e4.ans[k]; if (ok) p4 += 1.5; det.e4.push({ ok }); });
    const score = Math.round((p1 + p2 + p3 + p4) * 4) / 4;
    EX.graded = { score, parts: [p1, p2, p3, p4], det };
    const d = new Date(); S.exams.push({ date: d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }), score, parts: [p1, p2, p3, p4] });
    S.xp += Math.round(score * 5); touchDay();
    // statistiques d'entraînement
    det.e1.forEach(x => award('ex1', x.pts === 1.5, 0, null, true)); det.e2.forEach(x => award('ex2', x.pts === 1, 0, null, true)); det.e3.forEach(x => award('ex3', x.ok, 0, null, true)); det.e4.forEach(x => award('ex4', x.ok, 0, null, true)); checkBadges();
    if (score >= 16) grant('e16'); if (score >= 20) grant('e20');
    save(); hud();
  }
  function examResult() {
    const { st, e1, e2, e3, e4, graded } = EX; const { score, parts, det } = graded;
    const C = 2 * Math.PI * 70, frac = score / 20;
    const mention = score >= 18 ? 'Excellent. Tu es prêt.' : score >= 16 ? 'Très bien. Peaufine les détails.' : score >= 12 ? 'Correct. Retravaille les exercices en rouge.' : score >= 8 ? 'Fragile. Reprends la méthode exercice par exercice.' : 'On reprend les bases : commence par la Méthode 20/20.';
    app.innerHTML = `
    <div class="stack" style="gap:22px">
      <div class="card row" style="gap:26px;align-items:center">
        <svg class="score-ring" viewBox="0 0 170 170" role="img" aria-label="Note ${score} sur 20"><circle cx="85" cy="85" r="70" fill="none" stroke="var(--line2)" stroke-width="12"/><circle id="ring" cx="85" cy="85" r="70" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 85 85)" style="transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)"/><text x="85" y="92" text-anchor="middle" fill="var(--fg)" font-family="Chakra Petch, sans-serif" font-size="38" font-weight="700" id="sc">0</text><text x="85" y="116" text-anchor="middle" fill="var(--muted)" font-size="13" font-family="JetBrains Mono, monospace">/ 20</text></svg>
        <div class="stack" style="gap:10px;flex:1;min-width:220px"><span class="eyebrow">Résultat de l'examen blanc</span><h2>${mention}</h2>
          <div class="grid4">${['Ex.1', 'Ex.2', 'Ex.3', 'Ex.4'].map((n, i) => `<div><div class="tiny">${n}</div><div class="mono" style="font-size:20px">${String(parts[i]).replace('.', ',')}<span class="tiny"> / ${[6, 4, 4, 6][i]}</span></div><div class="meter" style="margin-top:4px"><i style="width:${parts[i] / [6, 4, 4, 6][i] * 100}%"></i></div></div>`).join('')}</div>
          <div class="row"><button class="btn pri" id="exagain" type="button">Nouvel examen</button><a class="btn" href="#guide">Revoir la méthode</a></div></div>
      </div>
      <section class="exsec"><div class="hdr"><h3>Correction · Exercice 1</h3></div>
        ${e1.map((g, i) => `<div class="card stack" style="gap:10px"><div class="row" style="justify-content:space-between"><div class="instr" style="font-size:15px;padding:8px 12px">${esc(g.ins)}</div><span class="pill ${det.e1[i].pts === 1.5 ? 'ok' : 'ko'}">${String(det.e1[i].pts).replace('.', ',')} / 1,5</span></div>${chainHTML(G.explain1(st, g.ins))}<div class="memtbl">${memRows(st, g.res.mem, k => g.res.memChanged[k] ? 'ch' : '')}</div><div class="sub">Registres : ${regsChangedTxt(g.res)} ${det.e1[i].memOk ? '' : '· <span style="color:var(--ko)">mémoire fausse</span>'} ${det.e1[i].regOk ? '' : '· <span style="color:var(--ko)">registres faux</span>'}</div></div>`).join('')}
      </section>
      <section class="exsec"><div class="hdr"><h3>Correction · Exercice 2</h3></div>
        ${e2.map((q, i) => `<div class="card stack" style="gap:8px"><div class="row" style="justify-content:space-between"><span class="mono" style="font-size:17px">${q.text} = $${hx(q.r, q.s * 2)} · N=${q.N} Z=${q.Z} V=${q.V} C=${q.C}</span><span class="pill ${det.e2[i].pts === 1 ? 'ok' : 'ko'}">${String(det.e2[i].pts).replace('.', ',')} / 1</span></div><div class="explain">${G.explain2(q).map(l => `<div>${l}</div>`).join('')}</div></div>`).join('')}
      </section>
      <section class="exsec"><div class="hdr"><h3>Correction · Exercice 3</h3></div>
        ${e3.map((q, i) => `<div class="card stack" style="gap:6px"><div class="row" style="justify-content:space-between"><span>${esc(q.q)}</span><span class="pill ${det.e3[i].ok ? 'ok' : 'ko'}">${det.e3[i].ok ? '1' : '0'} / 1</span></div><span class="mono" style="color:var(--acc)">${esc(q.show)}</span><span class="sub">${esc(q.why)}</span></div>`).join('')}
      </section>
      <section class="exsec"><div class="hdr"><h3>Correction · Exercice 4</h3><button class="btn sm ghost" id="exlab" type="button">Tracer au Labo</button></div>
        <div class="grid2">${listing(e4.prog)}<div class="stack">${e4.ex.map((x, k) => `<div class="card stack" style="gap:6px"><div class="row" style="justify-content:space-between"><span class="mono" style="color:var(--acc)">${x.t} = $${hx(e4.ans[k], 8)}</span><span class="pill ${det.e4[k].ok ? 'ok' : 'ko'}">${det.e4[k].ok ? '1,5' : '0'} / 1,5</span></div><div class="explain">${x.lines.map(l => `<div>${l}</div>`).join('')}</div></div>`).join('')}</div></div>
      </section>
    </div>`;
    $('#exagain').onclick = () => { EX = null; examIntro(); };
    $('#exlab').onclick = () => openInLabo(e4.prog);
    requestAnimationFrame(() => { $('#ring').style.strokeDashoffset = C * (1 - frac); });
    let k = 0; const steps = 30; const iv = setInterval(() => { k++; const v = Math.round(score * k / steps * 4) / 4; const el = $('#sc'); if (el) el.textContent = String(v).replace('.', ','); if (k >= steps) { clearInterval(iv); if (score >= 14) confetti(score >= 18 ? 220 : 120); } }, 40);
    cleanup = () => clearInterval(iv);
  }

  /* ================= démarrage ================= */
  function setAcc(a) { S.acc = a; document.documentElement.dataset.acc = a === 'blue' ? '' : a; if (a === 'blue') delete document.documentElement.dataset.acc; save(); hud(); }
  $$('.sw').forEach(b => b.onclick = () => setAcc(b.dataset.acc));
  $('#sndbtn').onclick = () => { S.snd = !S.snd; save(); hud(); if (S.snd) sfx('ok'); };
  setAcc(S.acc || 'blue');
  const setHH = () => document.documentElement.style.setProperty('--hh', $('.top').offsetHeight + 'px');
  addEventListener('resize', setHH); setHH();
  hud(); go();
})();
</script>
</body></html>
